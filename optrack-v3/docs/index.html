<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpTrack — Opportunity Departures Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#0e1116; --panel:#161b22; --panel-2:#1c222b; --divider:#2a303b;
    --text-primary:#f2f1ec; --text-muted:#8b93a1;
    --amber:#ffb020; --green:#4ade80; --gray:#6b7280; --red:#f87171; --focus:#7dd3fc;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  body{
    margin:0; background:var(--bg-page);
    background-image:radial-gradient(ellipse at top, rgba(255,176,32,0.06), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--text-primary); font-family:'Inter', sans-serif; min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:960px; margin:0 auto; padding:32px 20px 80px;}
  header.board-head{background:var(--panel); border:1px solid var(--divider); border-radius:10px; padding:28px 28px 22px; position:relative; overflow:hidden;}
  header.board-head::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%); pointer-events:none;}
  .live-tag{display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.08em; color:var(--green); border:1px solid rgba(74,222,128,0.35); background:rgba(74,222,128,0.08); padding:3px 8px; border-radius:20px; margin-bottom:14px;}
  .live-dot{width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.25;}}
  h1.title{font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:clamp(42px, 9vw, 72px); letter-spacing:0.02em; margin:0; line-height:0.9; text-shadow:0 0 18px rgba(255,176,32,0.15);}
  .title .flap{display:inline-block; animation:flapin 0.5s ease both;}
  .title .flap:nth-child(2){animation-delay:.05s;} .title .flap:nth-child(3){animation-delay:.1s;} .title .flap:nth-child(4){animation-delay:.15s;}
  .title .flap:nth-child(5){animation-delay:.2s;} .title .flap:nth-child(6){animation-delay:.25s;} .title .flap:nth-child(7){animation-delay:.3s;}
  @keyframes flapin{from{transform:rotateX(90deg); opacity:0;} to{transform:rotateX(0deg); opacity:1;}}
  .subtitle{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-muted); margin-top:10px;}
  .controls{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-top:22px;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tab{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.05em; background:var(--panel-2); border:1px solid var(--divider); color:var(--text-muted); padding:8px 14px; border-radius:6px; cursor:pointer; transition:all .15s ease;}
  .tab:hover{color:var(--text-primary); border-color:var(--amber);}
  .tab.active{color:#0e1116; background:var(--amber); border-color:var(--amber); font-weight:700;}
  .tab:focus-visible, .search input:focus-visible, .archive-toggle:focus-visible, .board-row:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .search input{font-family:'JetBrains Mono', monospace; font-size:13px; background:var(--panel-2); border:1px solid var(--divider); color:var(--text-primary); padding:9px 12px; border-radius:6px; min-width:200px;}
  .search input::placeholder{color:var(--text-muted);}
  .next-departure{margin-top:20px; background:linear-gradient(90deg, rgba(255,176,32,.12), rgba(255,176,32,.02)); border:1px solid rgba(255,176,32,.4); border-radius:10px; padding:16px 20px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline;}
  .next-departure .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; color:var(--amber); font-weight:700; width:100%;}
  .next-departure .name{font-size:18px; font-weight:600;}
  .next-departure .meta{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-muted);}
  .board{margin-top:26px; background:var(--panel); border:1px solid var(--divider); border-radius:10px; overflow:hidden;}
  .board-cols{display:grid; grid-template-columns:110px 1fr 110px 120px 90px; gap:10px; padding:10px 20px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; color:var(--text-muted); border-bottom:1px solid var(--divider);}
  .board-row{display:grid; grid-template-columns:110px 1fr 110px 120px 90px; gap:10px; padding:14px 20px; align-items:center; border-bottom:1px solid var(--divider); text-decoration:none; color:var(--text-primary); transition:background .15s ease; animation:rowin .35s ease both;}
  .board-row:last-child{border-bottom:none;}
  .board-row:hover{background:var(--panel-2);}
  @keyframes rowin{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .status{display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.05em;}
  .status .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .status.open .dot{background:var(--green); box-shadow:0 0 6px rgba(74,222,128,.6);}
  .status.hold .dot{background:var(--amber); box-shadow:0 0 6px rgba(255,176,32,.6); animation:pulse 1.4s infinite;}
  .status.closed .dot{background:var(--gray);}
  .status.open{color:var(--green);} .status.hold{color:var(--amber);} .status.closed{color:var(--gray);}
  .opp-name-wrap{overflow:hidden;}
  .opp-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
  .opp-comment{font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;}
  .opp-type{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-muted);}
  .opp-deadline{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-muted);}
  .opp-deadline.overdue{color:var(--red);}
  .opp-tminus{font-family:'JetBrains Mono', monospace; font-size:12px; text-align:right;}
  .board-row.closed-row .opp-name{color:var(--text-muted);}
  .archive-toggle{padding:14px 20px; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-muted); cursor:pointer; text-align:center; background:var(--panel-2); border:none; width:100%;}
  .archive-toggle:hover{color:var(--text-primary);}
  #archiveRows{display:none;} #archiveRows.show{display:block;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--text-muted); font-family:'JetBrains Mono', monospace; font-size:13px;}
  footer{margin-top:28px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-muted);}
  footer a{color:var(--amber); text-decoration:none; font-weight:600;}
  footer a:hover{text-decoration:underline;}
  @media (max-width:640px){
    .board-cols{display:none;}
    .board-row{grid-template-columns:1fr; gap:4px; padding:16px 18px;}
    .opp-name{white-space:normal;}
    .opp-tminus{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="board-head">
    <span class="live-tag"><span class="live-dot"></span>LIVE BOARD</span>
    <h1 class="title">
      <span class="flap">O</span><span class="flap">p</span><span class="flap">T</span><span class="flap">r</span><span class="flap">a</span><span class="flap">c</span><span class="flap">k</span>
    </h1>
    <div class="subtitle">DEPARTURES — INTERNSHIPS &amp; SCHOLARSHIPS · MAINTAINED BY MESA</div>
    <div class="controls">
      <div class="tabs" role="tablist" aria-label="Filter by type">
        <button class="tab active" data-filter="all">ALL</button>
        <button class="tab" data-filter="Internship">INTERNSHIPS</button>
        <button class="tab" data-filter="Scholarship">SCHOLARSHIPS</button>
      </div>
      <div class="search"><input type="text" id="searchInput" placeholder="Search by name…" aria-label="Search opportunities by name"></div>
    </div>
  </header>

  <div id="nextDeparture" class="next-departure" style="display:none;">
    <div class="eyebrow">NEXT DEPARTURE</div>
    <div class="name" id="ndName"></div>
    <div class="meta" id="ndMeta"></div>
  </div>

  <div class="board">
    <div class="board-cols">
      <div>STATUS</div><div>NAME</div><div>TYPE</div><div>DUE DATE</div><div style="text-align:right;">T-MINUS</div>
    </div>
    <div id="activeRows"></div>
    <button class="archive-toggle" id="archiveToggle" style="display:none;">▾ Show closed opportunities (0)</button>
    <div id="archiveRows"></div>
    <div id="emptyState" class="empty-state" style="display:none;">No opportunities match your search.</div>
    <div id="loadingState" class="empty-state">Loading…</div>
  </div>

  <footer>
    <span>Built for CIST 4B1 — Advanced Java · maintained by MESA staff &amp; student assistants</span>
    <a href="edit.html">Staff edit page →</a>
  </footer>
</div>

<script>
let ALL = [];
let currentFilter = 'all';

// small quote-aware CSV line splitter (mirrors the Java parser)
function parseCsvLine(line){
  const out = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (c === '"'){
      inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes){
      out.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  const headers = parseCsvLine(lines[0]);
  return lines.slice(1).map(line => {
    const cols = parseCsvLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] || '').trim());
    return obj;
  });
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function tMinusLabel(days){
  if (isNaN(days)) return '—';
  if (days < 0) return `${Math.abs(days)}d AGO`;
  if (days === 0) return 'TODAY';
  return `T-${days}d`;
}
function statusClass(status){
  if (status === 'Open') return 'open';
  if (status === 'On Hold') return 'hold';
  return 'closed';
}
function statusLabel(status){
  if (status === 'Open') return 'OPEN';
  if (status === 'On Hold') return 'ON HOLD';
  return 'CLOSED';
}

function rowHTML(o){
  const days = daysUntil(o.DueDate);
  const st = statusClass(o.Status);
  const overdue = st !== 'closed' && !isNaN(days) && days < 0;
  const typeAbbr = (o.Type || '').toUpperCase().slice(0,3);
  const linkHref = /^https?:\/\//.test(o.Link) ? o.Link : '#';
  const rowClass = st === 'closed' ? 'board-row closed-row' : 'board-row';
  return `
    <a class="${rowClass}" href="${linkHref}" target="_blank" rel="noopener" data-type="${o.Type}" data-name="${(o.Name||'').toLowerCase()}">
      <span class="status ${st}"><span class="dot"></span>${statusLabel(o.Status)}</span>
      <span class="opp-name-wrap">
        <span class="opp-name">${o.Name}</span>
        ${o.Comments ? `<span class="opp-comment">${o.Comments}</span>` : ''}
      </span>
      <span class="opp-type">${typeAbbr}</span>
      <span class="opp-deadline ${overdue ? 'overdue' : ''}">${o.DueDate || '—'}</span>
      <span class="opp-tminus">${tMinusLabel(days)}</span>
    </a>`;
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = ALL.filter(o => {
    const matchesType = currentFilter === 'all' || o.Type === currentFilter;
    const matchesQuery = (o.Name || '').toLowerCase().includes(q);
    return matchesType && matchesQuery;
  });

  const active = filtered.filter(o => o.Status !== 'Close')
                          .sort((a,b) => daysUntil(a.DueDate) - daysUntil(b.DueDate));
  const closed = filtered.filter(o => o.Status === 'Close')
                          .sort((a,b) => daysUntil(b.DueDate) - daysUntil(a.DueDate));

  document.getElementById('activeRows').innerHTML = active.map(rowHTML).join('');

  const archiveToggle = document.getElementById('archiveToggle');
  const archiveRows = document.getElementById('archiveRows');
  if (closed.length > 0){
    archiveToggle.style.display = 'block';
    archiveToggle.textContent = `▾ Show closed opportunities (${closed.length})`;
    archiveRows.innerHTML = closed.map(rowHTML).join('');
  } else {
    archiveToggle.style.display = 'none';
    archiveRows.innerHTML = '';
    archiveRows.classList.remove('show');
  }

  document.getElementById('emptyState').style.display = (active.length === 0 && closed.length === 0) ? 'block' : 'none';

  const nd = document.getElementById('nextDeparture');
  const openOnly = active.filter(o => o.Status === 'Open');
  if (openOnly.length > 0){
    const next = openOnly[0];
    nd.style.display = 'flex';
    document.getElementById('ndName').textContent = next.Name;
    document.getElementById('ndMeta').textContent = `${next.Type} · ${next.DueDate} · ${tMinusLabel(daysUntil(next.DueDate))}`;
  } else {
    nd.style.display = 'none';
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('archiveToggle').addEventListener('click', () => {
  document.getElementById('archiveRows').classList.toggle('show');
});

fetch('data.csv')
  .then(r => {
    if (!r.ok) throw new Error('data.csv not found (HTTP ' + r.status + ')');
    return r.text();
  })
  .then(text => {
    document.getElementById('loadingState').style.display = 'none';
    ALL = parseCSV(text);
    render();
  })
  .catch(err => {
    document.getElementById('loadingState').textContent = 'Could not load data.csv — ' + err.message;
    console.error(err);
  });
</script>
</body>
</html>
